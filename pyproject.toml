[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scada-rag-copilot"
version = "0.1.0"
description = "SCADA alarm root-cause copilot: retrieve likely causes from a local wind-turbine knowledge base."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "llama-index-core>=0.12",
    "llama-index-embeddings-huggingface>=0.4",
    "llama-index-vector-stores-chroma>=0.4",
    "llama-index-llms-ollama>=0.4",
    "chromadb>=0.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pre-commit>=3.5",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: retrieval against the real local embedding model",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
