    turbine_id: T07
    alarm_code: Gearbox oil pressure low
    timestamp: "2026-10-17T08:30:00Z"
    snapshot:
      Gear_Oil_Press_Avg: 0.8
      Gear_Oil_Temp_Avg: 48.0
      Gear_Bear_Temp_Avg: 50.2
      Grd_Prod_Pwr_Avg: 900

  - id: pitch_blade2_deviation
