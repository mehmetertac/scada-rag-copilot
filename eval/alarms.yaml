# Hand-labelled synthetic alarms for eval. expected_source: kb filename or "abstain".
scenarios:
  - id: hss_bearing_partial_load
    expected_source: gearbox_hss_bearing_overtemp.md
    turbine_id: T06
    alarm_code: Gearbox HSS bearing temperature high
    timestamp: "2026-10-15T03:12:00Z"
    snapshot:
      Gear_Bear_Temp_Avg: 78.2
      Gear_Oil_Temp_Avg: 52.1
      Grd_Prod_Pwr_Avg: 420
      Rtr_RPM_Avg: 11.2
      Nac_Temp_Avg: 18.5
    anomaly_score: 0.82
    shap_sensors:
      - tag: Gear_Bear_Temp_Avg
        contribution: 0.41
      - tag: Grd_Prod_Pwr_Avg
        contribution: 0.12

  - id: gearbox_oil_high_bearing_normal
    expected_source: gearbox_oil_overtemp.md
    turbine_id: T01
    alarm_code: Gearbox oil temperature high
    timestamp: "2026-10-16T14:00:00Z"
    snapshot:
      Gear_Oil_Temp_Avg: 71.0
      Gear_Bear_Temp_Avg: 54.0
      Grd_Prod_Pwr_Avg: 1800
      Rtr_RPM_Avg: 18.5

  - id: gearbox_lube_pressure
